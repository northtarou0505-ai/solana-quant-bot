name: Solana Quant Auto Trader (24/7 Cloud Runner)

on:
  # 定期自動起動して市場スキャン・売買判定・Telegramレポート送信を実行
  schedule:
    - cron: "*/15 * * * *"
  # GitHub画面の「Run workflow」ボタンからいつでも手動で即時実行も可能
  workflow_dispatch:
    inputs:
      trading_mode:
        description: "動作モード (PAPER または LIVE)"
        required: false
        default: "PAPER"

# 二重発注・Git競合を100%防ぐため、同時に複数のジョブが重なって走らないように制御
concurrency:
  group: solana-quant-trader-lock
  cancel-in-progress: false

permissions:
  # 売買結果やポジション状態(data/portfolio_state.json)を自動保存するために書き込み権限を付与
  contents: write

jobs:
  run-quant-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 1. リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: 2. Python 3.12 セットアップ（高速キャッシュ付き）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. 必要なライブラリのインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Solana クオンツ自動売買スキャン＆Telegram通知を実行 (--once --notify)
        env:
          # GitHub Secrets（暗号化金庫）から読み込む。未設定時は安全なPAPERモードで動作
          TRADING_MODE: ${{ github.event.inputs.trading_mode || secrets.TRADING_MODE || 'PAPER' }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python solana_quant_trader.py --once --notify

      - name: 5. ポジション・資産状態 (data/portfolio_state.json) を自動保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio_state.json
          if git diff --staged --quiet; then
            echo "ポジション・資産状態の変更なし（コミット不要）"
          else
            git commit -m "chore: update portfolio state [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
