name: Solana Quant Auto Trader (24/7 Cloud Runner)

on:
  # 複数の時間帯にcronを配置し、1回の起動で3.5時間連続稼働させることでGitHubのcron遅延を完全カバーする
  schedule:
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  # GitHub画面の「Run workflow」ボタンからいつでも手動で即時スタート可能
  workflow_dispatch:
    inputs:
      trading_mode:
        description: "動作モード (PAPER または LIVE)"
        required: false
        default: "PAPER"

# すでに稼働中のセッションがある場合は二重起動せず、バトンタッチで隙間なく稼働させる
concurrency:
  group: solana-quant-trader-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-quant-trader:
    runs-on: ubuntu-latest
    # 1セッションあたり3.5時間(210分)連続で監視＆30分おきにTelegram通知を行う（Publicリポジトリは時間無制限・完全無料）
    timeout-minutes: 240

    steps:
      - name: 1. リポジトリの最新コードと資産状態を取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Python 3.12 セットアップ（高速キャッシュ付き）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 3. 必要なライブラリのインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Solana クオンツ連続監視＆Telegram定期レポート稼働 (3.5時間セッション)
        env:
          TRADING_MODE: ${{ github.event.inputs.trading_mode || secrets.TRADING_MODE || 'PAPER' }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python solana_quant_trader.py --cloud-loop --duration-minutes 210 --notify-interval-minutes 30

      - name: 5. セッション終了時のポジション・資産状態を最終保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio_state.json
          if git diff --staged --quiet; then
            echo "ポジション・資産状態の変更なし（コミット不要）"
          else
            git commit -m "chore: update portfolio state"
            git pull --rebase origin main || true
            git push origin main
          fi
